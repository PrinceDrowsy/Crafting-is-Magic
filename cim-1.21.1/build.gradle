plugins {
	id 'fabric-loom' version '1.17.17'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven { // For ImGuiMC (Veil's own required dependency)
		url = "https://maven.ryanhcode.dev/releases"
		name = "RyanHCode Maven"
	}
	maven { // For Veil
		name = 'BlameJared Maven (CrT / Bookshelf)'
		url = 'https://maven.blamejared.com'
	}
	maven { // For Mine Little Pony (optional compatibility dependency)
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
	}
	maven { // For GeckoLib
		name = 'GeckoLib'
		url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
		content {
			includeGroup('software.bernie.geckolib')
		}
	}
	maven { // For Simple Voice Chat's API (optional compatibility dependency)
		name = 'Simple Voice Chat Maven'
		url = 'https://maven.maxhenkel.de/repository/public'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"cim" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Veil (rendering library) for the Sonic Rainboom effect - shader particles and dynamic lights.
	modImplementation("foundry.veil:veil-fabric-${project.minecraft_version}:${project.veil_version}") {
		exclude group: "maven.modrinth"
		exclude group: "me.fallenbreath"
	}
	modImplementation "foundry.imguimc:imguimc-fabric-${project.minecraft_version}:${project.imguimc_version}"

	// Mine Little Pony - optional compatibility dependency (see the Compatibility section of the
	// README). Compile-only: the mod is never required at runtime, only used if the player has it
	// installed themselves, guarded behind FabricLoader.isModLoaded("minelittlepony") checks.
	modCompileOnly "maven.modrinth:mine-little-pony:${project.minelp_version}"
	// Mson - MineLP's own JSON-model/entity-renderer library. MineLP bundles it internally (jar-in-jar),
	// but that isn't visible on our compile classpath, so it needs its own explicit compile-only entry
	// to resolve MineLP's own API surface (ModelKey, EntityRendererRegistry, etc.).
	modCompileOnly "maven.modrinth:mson:${project.mson_version}"

	// GeckoLib - required (not compile-only like MineLP/Mson above), since this is meant to become
	// the mod's own native pony model/animation library rather than an optional integration with
	// someone else's mod.
	modImplementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"

	// Simple Voice Chat - optional compatibility dependency (Changeling voice mimicry). Compile-only,
	// same shape as MineLP above: never required at runtime, only used if the player has it installed,
	// guarded behind FabricLoader.isModLoaded("voicechat") checks. The plugin entrypoint itself
	// (fabric.mod.json's "voicechat" key) is inherently safe with no such check needed - Simple Voice
	// Chat is the only thing that ever queries that entrypoint, so it simply never fires without it.
	compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
}

// Loom auto-injects fabric-loader and sponge-mixin, but on this Loom version they resolve to a
// mismatched pair (fabric-loader gets bumped to 0.19.3 by conflict resolution while sponge-mixin
// stays pinned to an older 0.15.4 build lacking classes 0.19.3's mixin bootstrap expects, causing
// a NoClassDefFoundError: IAdviceProvider crash on launch). Force a newer, compatible sponge-mixin.
configurations.all {
	resolutionStrategy {
		force "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}