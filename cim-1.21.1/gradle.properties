# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.13

# Mod Properties
mod_version=1.0.0
maven_group=craftingismagic.cim
archives_base_name=cim

# Dependencies
fabric_version=0.115.4+1.21.1

# Veil (rendering library, for the Sonic Rainboom effect) and its required ImGuiMC dependency
veil_version=4.4.1
imguimc_version=2.0.3

# Mine Little Pony (optional compatibility dependency, compile-only - not required at runtime)
minelp_version=4.14.2+1.21
mson_version=1.10.0+1.21

# GeckoLib (native pony model/animation library - for the mod's own Blockbench-authored models,
# once they exist, replacing the current MineLP-borrowed rendering for those entities)
geckolib_version=4.7.4

# Simple Voice Chat (optional compatibility dependency, compile-only - not required at runtime;
# Changeling voice mimicry). API version, not the mod's own release version - matched against the
# maven-metadata.xml at maven.maxhenkel.de/repository/public/de/maxhenkel/voicechat/voicechat-api/
voicechat_api_version=2.6.13

# YACL + Mod Menu (optional - the in-game config screen; compile-only, dev-client runtime only)
yacl_version=3.8.1+1.21.1-fabric
modmenu_version=11.0.5